name: Build CLI distributions

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'tools/release/**'
      - 'npm/**'
      - 'packaging/**'
      - 'Formula/**'
      - 'go.mod'
      - 'go.sum'
      - 'LICENSE'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  verify:
    # Pull requests already run the complete suite in verify.yml.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./internal/... ./cmd/... ./tools/...
      - name: Run the black-box parity harness
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus gnome-keyring libsecret-tools
          e2e/run.sh
      - name: Check release version and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/version/version.go)
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor HEAD origin/main

  package:
    if: ${{ !cancelled() && (needs.verify.result == 'success' || github.event_name == 'pull_request') }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      # npm packs the per-platform npm package; nothing is published.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # The native credential stores and agent integrations, on each real OS.
      - run: go test ./internal/credentials/ ./internal/app/
      # Builds, starts the packaged executable with --help, then archives it.
      - run: go run ./tools/release package
      - name: Smoke test Windows package and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path internal/version/version.go -Pattern 'var Version = "(.+)"').Matches[0].Groups[1].Value
          $asset = "durin-$version-windows-x64.zip"
          $hash = (Get-FileHash "release/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content release/SHA256SUMS
          ./packaging/install-windows.ps1 -Version $version -ArchivePath "release/$asset" -ChecksumPath release/SHA256SUMS
          & "$env:LOCALAPPDATA/DurinCLI/bin/durin.cmd" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed launcher failed' }
          Remove-Item release/SHA256SUMS
      - name: Smoke test Debian package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./release/*.deb
          durin --help
      - name: Upload platform packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durin-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  metadata:
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    needs: package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: durin-*
          path: release
          merge-multiple: true
      - run: go run ./tools/release metadata
      - name: Install the generated Homebrew formula from the built archives
        run: |
          brew tap-new durin/ci
          sed -E "s#https://github.com/accessdurin/cli/releases/download/v[^/]+/#file://$PWD/release/#" release/durin.rb > "$(brew --repository durin/ci)/Formula/durin.rb"
          brew install durin/ci/durin
          brew test durin/ci/durin
      - name: Try the npm launcher with this platform's package
        run: |
          mkdir npm-check && cd npm-check && npm init --yes >/dev/null
          npm install ../release/accessdurin-cli-darwin-arm64-*.tgz ../release/accessdurin-cli-[0-9]*.tgz
          npx durin --help
      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durin-release
          path: release/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: metadata
    runs-on: ubuntu-24.04
    environment: cli-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: durin-release
          path: release
      - name: Create a reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes --title "Durin CLI $GITHUB_REF_NAME"
