name: Build CLI distributions

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'Formula/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'vite.config.ts'
      - 'LICENSE'
      - 'licenses/**'
      - '.github/workflows/release.yml'

permissions:
  contents: read

jobs:
  verify:
    # Pull requests already run the complete suite in verify.yml.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check release version and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_NAME !== "v" + p.version) process.exit(1)'
          git merge-base --is-ancestor HEAD origin/main

  package:
    if: ${{ !cancelled() && (needs.verify.result == 'success' || github.event_name == 'pull_request') }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-2025
            target: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test src/agent-integrations.test.ts src/bridge-config.test.ts
      - run: pnpm build
      - run: pnpm package:release
      - name: Smoke test packaged Unix launcher
        if: runner.os != 'Windows'
        run: ./.release-stage/bin/durin --help
      - name: Smoke test Windows package and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.release-stage/durin.cmd --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged launcher failed' }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $asset = "durin-$version-windows-x64.zip"
          $hash = (Get-FileHash "release/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content release/SHA256SUMS
          ./packaging/install-windows.ps1 -Version $version -ArchivePath "release/$asset" -ChecksumPath release/SHA256SUMS
          & "$env:LOCALAPPDATA/DurinCLI/bin/durin.cmd" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed launcher failed' }
          Remove-Item release/SHA256SUMS
      - name: Smoke test Debian package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./release/*.deb
          durin --help
      - name: Test Homebrew formula against the built npm archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node scripts/release-metadata.mjs release
          brew tap-new durin/ci
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const p = require("./package.json"); const text = fs.readFileSync("release/durin.rb", "utf8"); fs.writeFileSync("release/durin-ci.rb", text.replace(/url \"[^\"]+\"/, "url \"file://" + path.resolve("release/durin-cli-" + p.version + ".tgz") + "\""));'
          cp release/durin-ci.rb "$(brew --repository durin/ci)/Formula/durin.rb"
          brew install --build-from-source durin/ci/durin
          brew test durin/ci/durin
          rm release/durin-ci.rb release/durin.rb release/SHA256SUMS release/install-windows.ps1
      - name: Upload platform packages
        if: matrix.target != 'linux-x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durin-${{ matrix.target }}
          path: |
            release/*
            !release/durin-cli-*.tgz
          if-no-files-found: error
      - name: Upload packages and npm source archive
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: durin-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    environment: cli-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: durin-*
          path: release
          merge-multiple: true
      - run: node scripts/release-metadata.mjs release --check-formula
      - name: Create a reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes --title "Durin CLI $GITHUB_REF_NAME"
