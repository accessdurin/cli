name: Verify CLI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a circle emoji in the PR title
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ [🔴🟠🟡🟢🔵🟣🟤⚫⚪] ]]; then
            echo "::error::PR title must contain a circle emoji: 🔴 🟠 🟡 🟢 🔵 🟣 🟤 ⚫ ⚪"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./internal/... ./cmd/... ./tools/...
      - name: Cross-compile every release platform
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
      - name: Install the keyring used by the parity harness
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus gnome-keyring libsecret-tools
      - name: Run the black-box parity harness
        run: e2e/run.sh
      - run: go run ./tools/checksecrets
